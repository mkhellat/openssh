# Fork-only helper: reproduce the *failing* regress slice without the full
# CI Checks suite. Trigger via workflow_dispatch only (no pull_request).
#
# Upstream PR failures died in regress `rekey` (ssh failed / Broken pipe),
# especially Classic McEliece KEX. This workflow builds once, then runs only
# the requested LTESTS (default: rekey).
name: Investigate Ubuntu (fork)
on:
  workflow_dispatch:
    inputs:
      liboqs_ref:
        description: "liboqs git ref (branch, tag, or full SHA)"
        required: true
        default: "main"
      liboqs_repo:
        description: "liboqs clone URL"
        required: true
        default: "https://github.com/open-quantum-safe/liboqs.git"
      ltests:
        description: "Space-separated regress LTESTS names (not full run_tests.sh)"
        required: true
        default: "rekey"

jobs:
  ubuntu_rekey:
    runs-on: ubuntu-latest
    container:
      image: openquantumsafe/ci-ubuntu-jammy:latest
    env:
      LIBOQS_REPO: ${{ inputs.liboqs_repo }}
      LIBOQS_REF: ${{ inputs.liboqs_ref }}
      LTESTS: ${{ inputs.ltests }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4

      - name: Set up SSH environment
        run: |
          mkdir -p -m 0755 /var/empty
          groupadd sshd
          useradd -g sshd -c 'sshd privsep' -d /var/empty -s /bin/false sshd

      - name: Clone liboqs at requested ref
        shell: bash
        run: |
          set -exo pipefail
          rm -rf oqs-scripts/tmp && mkdir -p oqs-scripts/tmp
          git clone --filter=blob:none "${LIBOQS_REPO}" oqs-scripts/tmp/liboqs
          git -C oqs-scripts/tmp/liboqs fetch --filter=blob:none origin "${LIBOQS_REF}"
          git -C oqs-scripts/tmp/liboqs checkout --detach FETCH_HEAD
          echo "liboqs HEAD=$(git -C oqs-scripts/tmp/liboqs rev-parse HEAD)"
          echo "liboqs subject=$(git -C oqs-scripts/tmp/liboqs log -1 --oneline)"

      - name: Build liboqs
        run: ./oqs-scripts/build_liboqs.sh

      - name: Build OpenSSH
        run: env WITH_OPENSSL=true ./oqs-scripts/build_openssh.sh

      - name: Run only requested regress LTESTS
        shell: bash
        run: |
          set -exo pipefail
          echo "Running LTESTS='${LTESTS}' only (not oqs-test/run_tests.sh full suite)"
          # t-exec pulls regress-prep/binaries; LTESTS overrides the full list.
          make t-exec -e LTESTS="${LTESTS}"
